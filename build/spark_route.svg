<svg class="route" viewBox="20 60 370 780" role="img" aria-labelledby="routeT routeD">
      <title id="routeT">Map: Suburbia Park to the beach</title>
      <desc id="routeD">Suburbia Park sits beside the Seaview fields.  A short walk east reaches the Santa Ana River Trail footbridge.  The trail heads south past Atlanta Avenue (0.4 miles) and the Hamilton Avenue and Victoria Street bridge (0.4 miles more), then 1.3 miles to Pacific Coast Highway and 0.1 miles to the sand, about 2.2 miles in all.  From the river mouth it is about 3.2 miles along the beach to the Huntington Beach Pier and about 2.2 miles to the Newport Pier.</desc>
      <defs>
        <pattern id="roofs" width="14" height="12" patternUnits="userSpaceOnUse"><rect width="14" height="12" fill="#f4efe4"/><rect x="2" y="3" width="9" height="6" rx="1" fill="#e6dccb"/></pattern>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#57b3e0"/><stop offset="1" stop-color="#1d7fbd"/></linearGradient>
      </defs>
      <!-- land -->
      <rect x="0" y="0" width="420" height="860" fill="#f1ede3"/>
      <!-- other neighborhoods (texture) -->
      <rect x="20" y="60" width="370" height="560" fill="url(#roofs)" opacity=".55"/>
      <!-- beach and ocean: coastline runs northwest to southeast through the river mouth -->
      <path class="beach" d="M0 572 L143.5 692 L420 924 L420 860 L0 860Z"/>
      <path class="ocean" d="M0 600 L143.5 720 L420 952 L420 860 L0 860Z"/>
      <path class="foam" d="M0 604 L143.5 724 L420 956"/>
      <!-- Pacific Coast Highway -->
      <path class="road pch" d="M0 553 L157 685 L420 905"/>
      <!-- Atlanta Ave (ends at the river) and Hamilton Ave, which becomes Victoria St across the bridge -->
      <path class="road st" d="M20 236.4 H246"/>
      <path class="road st" d="M20 354.6 H390"/>
      <!-- Suburbia Park -->
      <rect class="hood" x="168" y="120" width="70" height="44" rx="8"/>
      <circle class="home-dot" cx="206.1" cy="138.7" r="7"/>
      <!-- Seaview fields -->
      <g transform="translate(222 112)">
        <path class="fld" d="M0 10 L-16 -6 A22 22 0 0 1 16 -6 Z"/>
        <path class="dia" d="M0 7 L-6 1 L0 -5 L6 1 Z"/>
      </g>
      <g class="flag" transform="translate(240 82)">
        <path class="pole" d="M0 32 V0"/>
        <g class="cloth">
          <rect x="1" y="0" width="26" height="16" fill="#fff"/>
          <path d="M1 1.2 H27 M1 3.6 H27 M1 6 H27 M1 8.4 H27 M1 10.8 H27 M1 13.2 H27 M1 15.4 H27" stroke="#d62839" stroke-width="1.25"/>
          <rect x="1" y="0" width="11" height="8.6" fill="#1d3f74"/>
          <path d="M3 2 h.1 M6 2 h.1 M9 2 h.1 M4.5 4.2 h.1 M7.5 4.2 h.1 M3 6.4 h.1 M6 6.4 h.1 M9 6.4 h.1" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
        </g>
      </g>
      <!-- Santa Ana River -->
      <path class="river" d="M330 60 C 310 100 296 125 291.4 139.5 C 284 166 266 182 258.4 194.3 C 230 260 190 420 165 560 C 156 620 148 670 143.5 712"/>
      <!-- river trail, west bank -->
      <path class="trail" d="M286 138 C 279 164 261 180 253 192 C 226 258 186 418 161 558 C 152 618 144 668 139 704"/>
      <g class="hbridge"><rect x="204" y="349" width="38" height="11" rx="2"/><path d="M204 348.5 H242 M204 360.5 H242"/></g>
      <!-- walk from the neighborhood to the footbridge -->
      <path class="walk" d="M212 140 C 240 146 262 146 288 140"/>
      <!-- the route the bike follows -->
      <path id="routePath" class="route-line" d="M206 139 C 240 146 262 146 288 140 C 279 164 261 180 253 192 C 226 258 186 418 161 558 C 152 618 144 668 139 704"/>
      <g class="rider">
        <circle r="8" class="rider-dot"/>
        <animateMotion dur="14s" repeatCount="indefinite" rotate="0" keyPoints="0;1;1" keyTimes="0;0.85;1" calcMode="linear"><mpath href="#routePath"/></animateMotion>
      </g>
      <!-- markers -->
      <circle class="mk" cx="291.4" cy="139.5" r="6"/>
      <circle class="mk" cx="258.4" cy="194.3" r="5"/>
      <circle class="mk mk-st" cx="248" cy="236.4" r="4.5"/>
      <circle class="mk mk-st" cx="221" cy="354.6" r="4.5"/>
      <circle class="mk mk-st" cx="151" cy="682" r="4.5"/>
      <circle class="mk mk-beach" cx="143.5" cy="712" r="8"/>
      <!-- labels -->
      <g class="lb t-home" transform="translate(130 160)"><rect x="-58" y="-14" width="116" height="26" rx="13"/><text y="4">Suburbia Park</text></g>
      <g class="lb" transform="translate(150 88)"><rect x="-58" y="-14" width="116" height="26" rx="13"/><text y="4">Seaview fields</text></g>
      <g class="lb" transform="translate(320 168)"><rect x="-46" y="-14" width="92" height="26" rx="13"/><text y="4">Footbridge</text></g>
      <g class="lb small" transform="translate(330 206)"><rect x="-38" y="-12" width="76" height="22" rx="11"/><text y="4">Mile 2</text></g>
      <text class="water" transform="translate(236 400) rotate(-76)">Santa Ana River</text>
      <text class="stname" x="26" y="230">Atlanta Ave</text>
      <text class="stname" x="26" y="348">Hamilton Ave</text>
      <text class="stname" x="300" y="348">Victoria St</text>
      <text class="stname sm" x="244" y="372">Bridge</text>
      <g class="mi" transform="translate(206 192)"><rect x="-30" y="-11" width="60" height="20" rx="10"/><text y="3.5">0.4 mi</text></g>
      <g class="mi" transform="translate(300 296)"><rect x="-30" y="-11" width="60" height="20" rx="10"/><text y="3.5">0.4 mi</text></g>
      <g class="mi" transform="translate(246 560)"><rect x="-30" y="-11" width="60" height="20" rx="10"/><text y="3.5">1.3 mi</text></g>
      <g class="mi" transform="translate(206 676)"><rect x="-30" y="-11" width="60" height="20" rx="10"/><text y="3.5">0.1 mi</text></g>
      <g class="lb big" transform="translate(318 440)"><rect x="-62" y="-30" width="124" height="56" rx="16"/><text y="-6">About 2.2 mi</text><text class="sub" y="14">footbridge to the sand</text></g>
      <text class="coastmi" transform="translate(34 676) rotate(40)">&#8598; HB Pier, about 3.2 mi</text>
      <text class="coastmi" transform="translate(28 828)">Newport Pier, about 2.2 mi &#8600;</text>
      <text class="roadname" transform="translate(64 598) rotate(40)">Pacific Coast Hwy</text>
      <g class="lb t-beach" transform="translate(236 716)"><rect x="-64" y="-14" width="128" height="26" rx="13"/><text y="4">The beach</text></g>
      <!-- north arrow -->
      <g class="north" transform="translate(52 96)"><circle r="16"/><path d="M0 -10 L6 6 L0 2 L-6 6Z"/><text y="30">N</text></g>
    </svg>