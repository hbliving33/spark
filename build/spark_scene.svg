    <path class="sea" d="M1240 240 C 1300 236 1380 232 1440 230 V320 H1300Z"/>
    <path class="surf s1" d="M1260 262 q18 -10 36 0 t36 0 t36 0 t36 0"/>
    <path class="surf s2" d="M1290 290 q18 -10 36 0 t36 0 t36 0 t36 0"/>
