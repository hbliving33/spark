<svg class="scene" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Illustration: Suburbia Park homes, the Seaview ballfields, the Santa Ana River Trail and the beach">
    <!-- pelicans gliding over the beach -->
    <g class="pelicans">
      <path class="pel p1" d="M0 0 q10 -8 20 0 q10 -8 20 0"/>
      <path class="pel p2" d="M0 0 q8 -6 16 0 q8 -6 16 0"/>
      <path class="pel p3" d="M0 0 q7 -5 14 0 q7 -5 14 0"/>
    </g>
    <!-- ground -->
    <path class="lawn" d="M0 236 C 200 228 420 232 560 236 L 800 236 L 820 320 H0Z"/>
    <!-- palms behind houses -->
    <g class="palm" transform="translate(70 128)"><path class="trunk" d="M8 110 C 6 70 10 36 18 6"/><path class="frond" d="M18 6 c-18 -6 -34 2 -42 14 c14 -10 28 -10 42 -10 c-10 -10 -26 -14 -38 -8 c16 -2 28 2 38 8 c4 -14 -2 -26 -12 -32 c8 10 12 20 12 28 c10 -12 26 -16 40 -10 c-14 0 -26 6 -36 14 c16 -4 30 0 40 10 c-14 -6 -28 -6 -42 0z"/></g>
    <g class="palm" transform="translate(436 108) scale(1.1)"><path class="trunk" d="M8 110 C 6 70 10 36 18 6"/><path class="frond" d="M18 6 c-18 -6 -34 2 -42 14 c14 -10 28 -10 42 -10 c-10 -10 -26 -14 -38 -8 c16 -2 28 2 38 8 c4 -14 -2 -26 -12 -32 c8 10 12 20 12 28 c10 -12 26 -16 40 -10 c-14 0 -26 6 -36 14 c16 -4 30 0 40 10 c-14 -6 -28 -6 -42 0z"/></g>
    <!-- shade trees behind the houses -->
    <g class="tree" transform="translate(146 142) scale(1.1)"><rect class="tr-trunk" x="-4" y="40" width="8" height="48" rx="3"/><circle class="tr-a" cx="0" cy="26" r="24"/><circle class="tr-b" cx="-16" cy="40" r="17"/><circle class="tr-b" cx="16" cy="38" r="18"/><circle class="tr-c" cx="-6" cy="18" r="10"/></g>
    <g class="tree" transform="translate(316 148)"><rect class="tr-trunk" x="-4" y="40" width="8" height="50" rx="3"/><circle class="tr-a" cx="0" cy="26" r="24"/><circle class="tr-b" cx="-16" cy="40" r="17"/><circle class="tr-b" cx="16" cy="38" r="18"/><circle class="tr-c" cx="-6" cy="18" r="10"/></g>
    <!-- Suburbia Park homes -->
    <g class="homes">
      <g class="houses-big" transform="translate(0 238) scale(1.15) translate(0 -238)">
      <g transform="translate(20 170)"><path class="roof r1" d="M-6 30 L50 -4 L106 30Z"/><rect class="wall" x="4" y="28" width="92" height="40"/><rect class="door" x="40" y="40" width="18" height="28"/><rect class="win" x="12" y="38" width="20" height="14"/><rect class="win" x="68" y="38" width="20" height="14"/></g>
      <g transform="translate(140 164)"><path class="roof r2" d="M-6 34 L60 -6 L126 34Z"/><rect class="wall w2" x="4" y="32" width="112" height="42"/><rect class="door" x="30" y="44" width="18" height="30"/><rect class="garage" x="62" y="46" width="46" height="28"/></g>
      <g transform="translate(286 172)"><path class="roof r3" d="M-6 28 L48 -4 L102 28Z"/><rect class="wall" x="4" y="26" width="88" height="40"/><rect class="door" x="38" y="38" width="18" height="28"/><rect class="win" x="10" y="36" width="20" height="14"/><rect class="win" x="64" y="36" width="20" height="14"/></g>
      </g>
      <!-- picket fence -->
      <path class="fence" d="M0 238 H458 M10 228 V246 M30 228 V246 M50 228 V246 M70 228 V246 M90 228 V246 M110 228 V246 M130 228 V246 M150 228 V246 M170 228 V246 M190 228 V246 M210 228 V246 M230 228 V246 M250 228 V246 M270 228 V246 M290 228 V246 M310 228 V246 M330 228 V246 M350 228 V246 M370 228 V246 M390 228 V246 M410 228 V246 M430 228 V246 M450 228 V246"/>
    </g>

    <!-- playground: slide, swings and a kid on a swing -->
    <g class="play" transform="translate(462 172) scale(.76)">
      <rect class="mulch" x="-6" y="82" width="152" height="10" rx="5"/>
      <path class="ladder" d="M8 86 L18 20 M28 86 L36 20 M12 66 H31 M14 50 H33 M16 34 H35"/>
      <rect class="tower-top" x="12" y="14" width="30" height="8" rx="2"/>
      <path class="roofp" d="M8 16 L27 0 L46 16Z"/>
      <path class="slide" d="M40 20 C 52 24 58 50 70 70 C 76 80 82 84 92 84"/>
      <path class="swingframe" d="M98 86 L114 14 L130 86 M114 14 H150 M150 14 L134 86 M150 14 L166 86"/>
      <g class="swing"><animateTransform attributeName="transform" type="rotate" values="20 132 14;-20 132 14;20 132 14" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="2.6s" repeatCount="indefinite"/><path class="chain" d="M126 14 V62 M138 14 V62"/><rect class="seat" x="122" y="60" width="20" height="5" rx="2"/><circle class="kid-head" cx="132" cy="46" r="6"/><path class="kid-body" d="M132 52 V62 M128 70 L132 62 L137 72"/></g>
    </g>
    <g class="scoreboard" transform="translate(626 150)">
      <path class="sb-post" d="M12 40 V82 M60 40 V82"/>
      <rect class="sb-board" x="0" y="0" width="72" height="42" rx="4"/>
      <rect class="sb-trim" x="0" y="0" width="72" height="8" rx="4"/>
      <text class="sb-lbl" x="8" y="20">HOME</text><text class="sb-lbl" x="8" y="34">GUEST</text>
      <rect class="sb-cell" x="44" y="12" width="20" height="11" rx="2"/><rect class="sb-cell" x="44" y="26" width="20" height="11" rx="2"/>
      <text class="sb-num" x="54" y="21.4">4</text><text class="sb-num" x="54" y="35.4">2</text>
      <circle class="sb-dot" cx="22" cy="4" r="1.6"/><circle class="sb-dot" cx="30" cy="4" r="1.6"/><circle class="sb-dot off" cx="38" cy="4" r="1.6"/>
    </g>
    <!-- Seaview ballfields -->
    <g class="field" transform="translate(560 150)">
      <path class="grass" d="M0 90 Q120 40 240 90 V100 H0Z"/>
      <path class="infield" d="M120 96 L84 80 L120 66 L156 80Z"/>
      <path class="backstop" d="M106 98 Q120 84 134 98" />
      <rect class="base" x="117" y="93" width="6" height="6"/><rect class="base" x="81" y="77" width="6" height="6"/><rect class="base" x="117" y="63" width="6" height="6"/><rect class="base" x="153" y="77" width="6" height="6"/>
    </g>
