    <g class="bleachers" transform="translate(776 206)">
      <path class="bl-frame" d="M2 30 L14 2 M50 30 L38 2 M2 30 H52"/>
      <rect class="bl-seat" x="10" y="2" width="32" height="5" rx="1.5"/><rect class="bl-seat" x="6" y="11" width="40" height="5" rx="1.5"/><rect class="bl-seat" x="2" y="20" width="48" height="5" rx="1.5"/>
      <circle class="bl-fan f1" cx="18" cy="-3" r="3.2"/><circle class="bl-fan f2" cx="34" cy="6" r="3.2"/><circle class="bl-fan f3" cx="12" cy="15" r="3.2"/>
    </g>
    <!-- Seaview Little League flag at the ballfield -->
    <g class="svflag" transform="translate(760 182)">
      <path class="svpole" d="M0 56 V0"/><circle class="svknob" cx="0" cy="-2" r="2.2"/>
      <g class="svcloth"><rect x="1" y="2" width="30" height="24" rx="2" fill="#fff" stroke="#0b6b3a" stroke-width="1.6"/><image href="assets/img/seaview-sv.png" x="6" y="4" width="20" height="20" preserveAspectRatio="xMidYMid meet"/></g>
    </g>
    <!-- bike path from the park along the river trail, under PCH, out to the sand -->
    <path class="lawn" d="M790 236 L 1010 236 L 1010 320 H 790Z"/>
    <path class="sand" d="M1010 236 C 1100 232 1180 236 1240 240 L 1300 320 H 1010Z"/>
    <path class="bikepath" d="M-30 276 C 300 272 700 278 1000 278 S 1150 280 1228 284"/>
    <g class="fam f-dad"><g><animateTransform attributeName="transform" type="scale" values="1 1;-1 1" keyTimes="0;0.5" calcMode="discrete" dur="40s" begin="0s" repeatCount="indefinite"/><g transform="scale(1) translate(-13 -8)"><circle class="wh" cx="0" cy="0" r="8"/><circle class="wh" cx="26" cy="0" r="8"/><path class="frame" d="M0 0 L10 -13 L22 -13 L26 0 M10 -13 L13 0 L0 0 M22 -13 L21 -19 M10 -13 L9 -17"/><rect class="cseat" x="-4" y="-22" width="9" height="8" rx="2"/><path class="torso tod" d="M1 -20 L2 -27"/><circle class="face" cx="2.5" cy="-31" r="3.6"/><path class="hel todh" d="M-1.5 -31.5 a4 3.6 0 0 1 8 0Z"/><path class="leg" d="M9 -19 L13 0"/><path class="torso dadc" d="M9 -19 L15 -33"/><path class="arm" d="M14 -30 L21 -20"/><circle class="face" cx="17" cy="-38" r="5"/><path class="hel dadch" d="M11.5 -39 a5.6 5 0 0 1 11 0Z"/></g></g>
      <animateMotion dur="40s" begin="0s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear" path="M-30 276 C 300 272 700 278 1000 278 S 1150 280 1228 284"/></g>
    <g class="fam f-mom"><g><animateTransform attributeName="transform" type="scale" values="1 1;-1 1" keyTimes="0;0.5" calcMode="discrete" dur="40s" begin="-1.1s" repeatCount="indefinite"/><g transform="scale(1) translate(-13 -8)"><circle class="wh" cx="0" cy="0" r="8"/><circle class="wh" cx="26" cy="0" r="8"/><path class="frame" d="M0 0 L10 -13 L22 -13 L26 0 M10 -13 L13 0 L0 0 M22 -13 L21 -19 M10 -13 L9 -17"/><path class="leg" d="M9 -19 L13 0"/><path class="torso momc" d="M9 -19 L15 -33"/><path class="arm" d="M14 -30 L21 -20"/><circle class="face" cx="17" cy="-38" r="5"/><path class="hel momch" d="M11.5 -39 a5.6 5 0 0 1 11 0Z"/><path class="hair" d="M12 -36 q-3 4 -2 8"/></g></g>
      <animateMotion dur="40s" begin="-1.1s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear" path="M-30 276 C 300 272 700 278 1000 278 S 1150 280 1228 284"/></g>
    <g class="fam f-kid"><g><animateTransform attributeName="transform" type="scale" values="1 1;-1 1" keyTimes="0;0.5" calcMode="discrete" dur="40s" begin="-2.1s" repeatCount="indefinite"/><g transform="scale(.72) translate(-13 -8)"><circle class="wh" cx="0" cy="0" r="8"/><circle class="wh" cx="26" cy="0" r="8"/><path class="frame" d="M0 0 L10 -13 L22 -13 L26 0 M10 -13 L13 0 L0 0 M22 -13 L21 -19 M10 -13 L9 -17"/><path class="leg" d="M9 -19 L13 0"/><path class="torso kidc" d="M9 -19 L15 -33"/><path class="arm" d="M14 -30 L21 -20"/><circle class="face" cx="17" cy="-38" r="5"/><path class="hel kidch" d="M11.5 -39 a5.6 5 0 0 1 11 0Z"/></g></g>
      <animateMotion dur="40s" begin="-2.1s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear" path="M-30 276 C 300 272 700 278 1000 278 S 1150 280 1228 284"/></g>

    <!-- Pacific Coast Highway runs along the beach, off toward the horizon; the bike path ducks under it -->
    <path class="pch-open" d="M987.5 268 H1001.5 L985.1 292 H971.1Z M1054.5 268 H1068.5 V292 H1070.9Z"/>
    <path class="pch-road" d="M1022 238 H1034 L1090 320 H966Z"/>
    <path class="pch-line" d="M1028 241 L1028 320"/>
    <path class="pch-edge" d="M1023 239 L968 320 M1033 239 L1088 320"/>
    <path class="pch-wall" d="M1004.2 264 L982.4 296 M1051.8 264 L1073.6 296"/>
    <path class="pch-rail" d="M1005.6 262 L1050.4 262"/>
    <g class="tower" transform="translate(1150 150)">
      <path class="legs" d="M8 86 L18 44 M52 86 L42 44 M14 66 H46"/>
      <rect class="deck" x="4" y="36" width="52" height="10"/>
      <rect class="hut" x="10" y="12" width="40" height="26"/>
      <path class="hroof" d="M4 14 L30 0 L56 14Z"/>
      <rect class="hwin" x="18" y="18" width="24" height="10"/>
